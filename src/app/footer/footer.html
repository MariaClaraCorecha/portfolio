<footer class="footer">
  <div class="footer-content">
    <div class="footer-brand">
      <span class="brand-mark">MC</span>
      <div>
        <p class="brand">Maria Clara Corecha</p>
        <p class="tagline">Desenvolvedora de Software Full Stack</p>
      </div>
    </div>
    <div class="footer-links">
      <a mat-icon-button [href]="githubUrl" target="_blank" rel="noopener" aria-label="GitHub">
        <mat-icon svgIcon="github"></mat-icon>
      </a>
      <a mat-icon-button [href]="'mailto:' + email" aria-label="Enviar e-mail">
        <mat-icon>email</mat-icon>
      </a>
      <span class="footer-email">{{ email }}</span>
    </div>
  </div>
  <p class="copyright">&copy; {{ year }} Maria Clara Corecha · Feito com Angular</p>
</footer>
