<header class="section-heading">
  <span class="section-eyebrow">04 · Stack</span>
  <h2>Tecnologias</h2>
</header>
<div class="tech-categories">
  @for (category of categories; track category.name) {
    <mat-card class="tech-category">
      <h3>
        <span class="category-icon" aria-hidden="true"
          ><mat-icon>{{ category.icon }}</mat-icon></span
        >
        {{ category.name }}
      </h3>
      <mat-chip-set [attr.aria-label]="category.name">
        @for (item of category.items; track item) {
          @let icon = getTechIcon(item);
          <mat-chip>
            @if (icon.kind === 'logo') {
              <img matChipAvatar [src]="icon.value" alt="" />
            } @else {
              <mat-icon matChipAvatar>{{ icon.value }}</mat-icon>
            }
            {{ item }}
          </mat-chip>
        }
      </mat-chip-set>
    </mat-card>
  }
</div>
