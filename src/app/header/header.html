<mat-toolbar class="header-bar" [class.scrolled]="scrolled()">
  <div class="header-inner">
    <a class="brand" href="#sobre" aria-label="Ir para o início">
      <span class="brand-mark">MC</span>
      <span class="brand-name">{{ title() }}</span>
    </a>
    <span class="spacer"></span>
    <nav class="nav-links" aria-label="Navegação principal">
      @for (link of links; track link.id) {
        <a
          [href]="'#' + link.id"
          [class.active]="activeSection.activeId() === link.id"
          [attr.aria-current]="activeSection.activeId() === link.id ? 'true' : null"
        >
          {{ link.label }}
        </a>
      }
    </nav>
    <a
      mat-icon-button
      class="github-link"
      [href]="githubUrl"
      target="_blank"
      rel="noopener"
      aria-label="GitHub"
    >
      <mat-icon svgIcon="github"></mat-icon>
    </a>
    <a mat-flat-button class="btn-gradient header-cta" href="#contato">Fale comigo</a>
    <button
      mat-icon-button
      class="nav-menu-trigger"
      aria-label="Abrir menu de navegação"
      [matMenuTriggerFor]="navMenu"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #navMenu="matMenu">
      @for (link of links; track link.id) {
        <a mat-menu-item [href]="'#' + link.id">
          <mat-icon>{{ link.icon }}</mat-icon
          >{{ link.label }}
        </a>
      }
    </mat-menu>
  </div>
</mat-toolbar>
