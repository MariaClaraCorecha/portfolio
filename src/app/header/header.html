<mat-toolbar color="primary">
  <span>{{ title() }}</span>
  <span class="spacer"></span>
  <nav class="nav-links">
    <a mat-button href="#sobre">Sobre mim</a>
    <a mat-button href="#experiencia">Experiência</a>
    <a mat-button href="#tecnologias">Tecnologias</a>
    <a mat-button href="#projetos">Projetos</a>
    <a mat-button href="#contato">Contato</a>
  </nav>
  <button
    mat-icon-button
    class="nav-menu-trigger"
    aria-label="Abrir menu de navegação"
    [matMenuTriggerFor]="navMenu"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #navMenu="matMenu">
    <a mat-menu-item href="#sobre">Sobre mim</a>
    <a mat-menu-item href="#experiencia">Experiência</a>
    <a mat-menu-item href="#tecnologias">Tecnologias</a>
    <a mat-menu-item href="#projetos">Projetos</a>
    <a mat-menu-item href="#contato">Contato</a>
  </mat-menu>
  <button mat-icon-button aria-label="GitHub">
    <mat-icon>code</mat-icon>
  </button>
</mat-toolbar>
