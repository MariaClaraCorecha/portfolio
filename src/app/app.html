<mat-toolbar color="primary">
  <span>{{ title() }}</span>
  <span class="spacer"></span>
  <button mat-icon-button aria-label="GitHub">
    <mat-icon>code</mat-icon>
  </button>
</mat-toolbar>

<main class="content">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Angular Material + TypeScript</mat-card-title>
      <mat-card-subtitle>Projeto inicial configurado</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>
        Este é o ponto de partida do seu portfólio, com Angular Material 3 já
        configurado (tema, tipografia e ícones).
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-flat-button color="primary">Começar</button>
    </mat-card-actions>
  </mat-card>

  <router-outlet />
</main>
