<header class="section-heading">
  <span class="section-eyebrow">02 · Formação</span>
  <h2>Formação Acadêmica</h2>
</header>
<div class="timeline">
  @for (entry of entries; track entry.course + entry.institution) {
    <mat-card class="timeline-item">
      <span class="timeline-icon" aria-hidden="true"><mat-icon>school</mat-icon></span>
      <div class="timeline-content">
        <mat-card-header>
          <mat-card-title>{{ entry.course }}</mat-card-title>
          <mat-card-subtitle>{{ entry.institution }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p class="period">
            <mat-icon>event</mat-icon>
            {{ entry.period }}
          </p>
          <mat-chip-set aria-label="Status">
            <mat-chip>{{ entry.status }}</mat-chip>
          </mat-chip-set>
          <p class="description">{{ entry.description }}</p>
        </mat-card-content>
      </div>
    </mat-card>
  }
</div>
