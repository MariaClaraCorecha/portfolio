<h2>Experiência</h2>
<div class="timeline">
  @for (entry of entries; track entry.role + entry.company) {
    <mat-card class="timeline-item">
      <mat-icon class="timeline-icon">work</mat-icon>
      <div class="timeline-content">
        <mat-card-header>
          <mat-card-title>{{ entry.role }}</mat-card-title>
          <mat-card-subtitle>{{ entry.company }} · {{ entry.period }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p class="summary">{{ entry.summary }}</p>
          <ul class="responsibilities">
            @for (item of entry.responsibilities; track item) {
              <li>{{ item }}</li>
            }
          </ul>
          <mat-chip-set aria-label="Tecnologias utilizadas">
            @for (tech of entry.technologies; track tech) {
              <mat-chip>{{ tech }}</mat-chip>
            }
          </mat-chip-set>
        </mat-card-content>
      </div>
    </mat-card>
  }
</div>
